# Baut das Image der Setup-UI und veröffentlicht es in ghcr.io (GitHub Container Registry).
# Nutzt nur den eingebauten GITHUB_TOKEN. Das Paket ist anfangs privat: unter
# "Package settings" einmal auf öffentlich stellen, damit `./setup.sh` es ohne Login zieht.
name: setup-image

on:
  push:
    branches: [main]
    paths: ["setup/**", ".github/workflows/setup-image.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ci_cd_stack-setup
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: setup
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
